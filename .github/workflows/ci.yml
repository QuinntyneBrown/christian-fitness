# Continuous integration (L2-042; docs/detailed-designs/operations/deploy-and-migrate).
# Every push to main and every pull request against it runs the frontend's lint, format check,
# build of both apps and Playwright behaviour specs, and the backend's build and tests. The whole
# run stays under five minutes and nothing is retried (AGENTS.md, "E2E (Playwright) and CI").
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer run for the same branch or pull request replaces the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      # The browser is cached by the installed Playwright version; a miss downloads Chromium's
      # headless shell, the only browser the specs use.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install the Playwright browser
        if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium

      - name: Behaviour specs
        id: specs
        run: npm run e2e

      - name: Keep the Playwright traces
        if: failure() && steps.specs.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json

      # Versions are pinned centrally (Directory.Packages.props), so it and the projects key the cache.
      - name: Restore the NuGet cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ChristianFitness.slnx

      # TreatWarningsAsErrors is set for every project in Directory.Build.props.
      - name: Build (warnings as errors)
        run: dotnet build ChristianFitness.slnx -c Release --no-restore

      # The API acceptance tests and the application tests, on EF Core InMemory: no database.
      - name: Test
        run: dotnet test ChristianFitness.slnx -c Release --no-build
