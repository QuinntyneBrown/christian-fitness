# The static host and reverse proxy for both apps (ADR 0047). Included inside http {}.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The platform's ingress appends the address it saw to X-Forwarded-For; the last entry is that
# address, so a value a client sent ahead of it is never used.
set_real_ip_from 0.0.0.0/0;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

# The access log names the path without its query: a query can carry a token, such as the
# newsletter's one-click unsubscribe (L2-058 AC7; ADR 0110), and no log carries one. The image's
# own log line in `main` format writes $request, so each server below logs in this format instead.
log_format cf '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status '
              '$body_bytes_sent "$http_user_agent"';

server_tokens off;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# The member app: www and any host name not listed below (the platform's own included).
server {
    listen 8080 default_server;
    server_name _;
    access_log /var/log/nginx/access.log cf;
    root /usr/share/nginx/html/web;

    # Dated legal documents never fall back to the Angular entry point.
    location ~ "^/(privacy|terms)/([0-9]{4}-[0-9]{2}-[0-9]{2})$" {
        include /etc/nginx/snippets/headers.conf;
        default_type text/html;
        try_files $uri.html =404;
    }

    # A story's address (L2-061 AC8, AC11; ADR 0105): the API answers the app's shell with the
    # story's title, description, previews and canonical link, a 301 from a former link, or the
    # shell with 404. Its own headers give way to the static host's, since the shell runs the app.
    # When the API has no shell to give (503) or is down, this host serves its own shell.
    location ~ "^/stories/[^/]+$" {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_intercept_errors on;
        error_page 502 503 504 = @shell;
        include /etc/nginx/snippets/headers.conf;
    }

    # The RSS feeds (L2-060; ADR 0072, ADR 0108): /feed and /<section>/feed are the API's, never the
    # app's routes. The API answers an unknown section 404 and sends the feeds' own caching headers.
    location = /feed {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ "^/[a-z0-9-]+/feed$" {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location @shell {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # The replica's probes; not proxied and not logged.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/snippets/static.conf;
}

# The admin app, on its own origin so the staff session never shares one with the member app.
server {
    listen 8080;
    server_name admin.christian.fitness;
    access_log /var/log/nginx/access.log cf;
    root /usr/share/nginx/html/admin;
    include /etc/nginx/snippets/static.conf;
}

# The bare domain goes to the member app.
server {
    listen 8080;
    server_name christian.fitness;
    access_log /var/log/nginx/access.log cf;
    return 301 https://www.christian.fitness$request_uri;
}
