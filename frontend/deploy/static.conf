# One app's files and its /api/, included by each server block in nginx.conf.
index index.html;

# The API in the same replica. It trusts X-Forwarded-For and X-Forwarded-Proto from this proxy only
# (ASPNETCORE_FORWARDEDHEADERS_ENABLED): the address is the one the platform's ingress saw, never a
# header a client sent, and the scheme is always https because the ingress refuses plain HTTP.
location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # WebSocket upgrades for the chat hub at /api/chat (ADR 0039).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    # An event image is at most 5 MB (ADR 0025); the API answers the refusal for anything larger.
    client_max_body_size 6m;
}

# Hashed by the build (outputHashing: all), so a file never changes under its name.
location ~* (?:\.(?:js|css)$|^/media/) {
    include /etc/nginx/snippets/headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Everything else is a file or a client-side route; index.html is always revalidated so a release
# is picked up on the next visit.
location / {
    include /etc/nginx/snippets/headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
}
