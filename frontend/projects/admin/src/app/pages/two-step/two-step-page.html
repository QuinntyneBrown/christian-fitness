<cf-staff-layout
  heading="Enter your code"
  lead="Open the authenticator app on your phone and enter the 6-digit code for Christian Fitness."
  note="Lost your phone? Ask an Admin to set up two-step verification again."
  noteIcon="smartphone"
  (submitted)="submit()"
>
  <cf-text-field
    slot="fields"
    fieldId="f-code"
    label="Verification code"
    name="code"
    autocomplete="one-time-code"
    inputmode="numeric"
    code
    [value]="code()"
    [readonly]="submitting()"
    [error]="error()"
    (valueChange)="code.set($event)"
  />
  <cf-button
    slot="submit"
    type="submit"
    size="lg"
    block
    [disabled]="submitting()"
    [busy]="submitting()"
  >
    @if (submitting()) {
      <svg class="icon icon--spin" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg
      >Verifying…
    } @else {
      Verify
    }
  </cf-button>
</cf-staff-layout>
