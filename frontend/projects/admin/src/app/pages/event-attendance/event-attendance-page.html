<cf-breadcrumb [items]="trail" (navigate)="navigate($event)" />

<div class="page-head">
  <div>
    <h1 class="admin-title">Attendance</h1>
    @if (title(); as eventTitle) {
      <p class="subtitle">{{ eventTitle }}</p>
    }
  </div>
</div>

<cf-tabs label="Event" [tabs]="tabs()" [current]="current()" (navigate)="navigate($event)" />

<ng-template #cameCell let-row>
  <cf-checkbox
    variant="compact"
    name="came"
    [label]="busyOf(row.id) ? 'Saving…' : 'Came'"
    [value]="row.id"
    [ariaLabel]="'Came: ' + row.name"
    [checked]="cameOf(row.id)"
    [busy]="busyOf(row.id)"
    (checkedChange)="tick(row.id, $event)"
  />
</ng-template>

@switch (state().kind) {
  @case ('loading') {
    <cf-skeleton-region label="Loading attendance">
      <cf-table
        caption="Attendance"
        [columns]="columns"
        [rows]="[]"
        [loading]="true"
        [loadingRows]="5"
      />
    </cf-skeleton-region>
  }
  @case ('failed') {
    <cf-empty-state
      variant="error"
      heading="Attendance didn't load"
      text="We couldn't reach the server. Try again in a moment."
    >
      <cf-button slot="actions" size="sm" (click)="tryAgain()">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
        </svg>
        Try again
      </cf-button>
    </cf-empty-state>
  }
  @default {
    @if (notStarted(); as text) {
      <cf-empty-state
        role="status"
        variant="tight"
        heading="Attendance opens when the event starts"
        [text]="text"
      />
    } @else if (rows().length > 0) {
      <p class="subtitle" role="status" aria-live="polite">{{ status() }}</p>
      <cf-table caption="Attendance" [columns]="columns" [rows]="rows()" [cell]="cameCell" />
    } @else {
      <cf-empty-state
        variant="tight"
        heading="No one to mark yet"
        text="Members who register for this event appear here once the event has started, each with a Came box."
      />
    }
  }
}

<cf-toast-region
  admin
  [toasts]="toastViews()"
  (dismissed)="dismissToast($event)"
  (paused)="toasts.pause($event)"
/>
