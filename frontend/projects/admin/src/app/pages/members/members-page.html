<div class="page-head page-head--wrap">
  <div>
    <h1 class="admin-title">Members</h1>
    @if (subtitle(); as count) {
      <p class="subtitle">{{ count }}</p>
    }
  </div>
  <cf-search-field label="Search members" placeholder="Search name or email" />
</div>

<cf-tabs label="Filter members" [tabs]="tabs()" [current]="currentHref()" />

<ng-template #statusCell let-row>
  <cf-status [variant]="statusOf(row.id)">{{ row.cells.status?.text }}</cf-status>
</ng-template>

@switch (state().kind) {
  @case ('loading') {
    <cf-skeleton-region label="Loading members">
      <cf-table
        caption="Members"
        width="wider"
        [columns]="columns"
        [rows]="[]"
        [loading]="true"
        [loadingRows]="7"
      />
    </cf-skeleton-region>
  }
  @case ('failed') {
    <cf-empty-state
      variant="error"
      heading="Members didn't load"
      text="We couldn't reach the server. Try again in a moment."
    >
      <cf-button slot="actions" size="sm" (click)="tryAgain()">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
        </svg>
        Try again
      </cf-button>
    </cf-empty-state>
  }
  @default {
    @if (rows().length > 0) {
      <cf-table
        caption="Members"
        width="wider"
        [columns]="columns"
        [rows]="rows()"
        [cell]="statusCell"
      />
    } @else {
      <cf-empty-state [heading]="empty().heading" [text]="empty().text" />
    }
  }
}
