<div class="page-head page-head--wrap">
  <div>
    <h1 class="admin-title">Events</h1>
    <p class="subtitle">Published events appear in the member app right away.</p>
  </div>
  <cf-button (click)="newEvent()">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 12h14" />
      <path d="M12 5v14" />
    </svg>
    New event
  </cf-button>
</div>

<cf-tabs label="Filter events" [items]="tabs()" (navigate)="navigate($event)" />

@switch (state().kind) {
  @case ('loading') {
    <cf-event-table loading />
  }
  @case ('failed') {
    <cf-error-state
      heading="Events didn't load"
      text="We couldn't reach the server. Try again in a moment."
      (retry)="tryAgain()"
    />
  }
  @default {
    @if (rows().length > 0) {
      <cf-event-table [rows]="rows()" />
    } @else if (tab() === 'all') {
      <cf-empty-state [heading]="empty().heading" [text]="empty().text">
        <cf-button size="sm" (click)="newEvent()">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14" />
            <path d="M12 5v14" />
          </svg>
          New event
        </cf-button>
      </cf-empty-state>
    } @else {
      <cf-empty-state variant="tight" [heading]="empty().heading" [text]="empty().text" />
    }
  }
}

<cf-toast-region [toasts]="toasts.toasts()" (dismiss)="toasts.dismiss($event)" />
