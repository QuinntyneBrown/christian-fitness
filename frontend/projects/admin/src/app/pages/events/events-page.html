<div class="page-head page-head--wrap">
  <div>
    <h1 class="admin-title">Events</h1>
    <p class="subtitle">Published events appear in the member app right away.</p>
  </div>
  <cf-button (click)="newEvent()">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 12h14" />
      <path d="M12 5v14" />
    </svg>
    New event
  </cf-button>
</div>

<cf-tabs
  label="Filter events"
  [tabs]="tabs()"
  [current]="currentHref()"
  (navigate)="navigate($event)"
/>

<ng-template #statusCell let-row>
  <cf-status [variant]="statusOf(row.id)">{{ row.cells.status?.text }}</cf-status>
</ng-template>

@switch (state().kind) {
  @case ('loading') {
    <cf-skeleton-region label="Loading events">
      <cf-table
        caption="Events"
        [columns]="columns"
        [rows]="[]"
        [loading]="true"
        [loadingRows]="5"
      />
    </cf-skeleton-region>
  }
  @case ('failed') {
    <cf-empty-state
      variant="error"
      heading="Events didn't load"
      text="We couldn't reach the server. Try again in a moment."
    >
      <cf-button slot="actions" size="sm" (click)="tryAgain()">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
        </svg>
        Try again
      </cf-button>
    </cf-empty-state>
  }
  @default {
    @if (rows().length > 0) {
      <cf-table caption="Events" [columns]="columns" [rows]="rows()" [cell]="statusCell" />
    } @else if (tab() === 'all') {
      <cf-empty-state [heading]="empty().heading" [text]="empty().text">
        <cf-button slot="actions" size="sm" (click)="newEvent()">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14" />
            <path d="M12 5v14" />
          </svg>
          New event
        </cf-button>
      </cf-empty-state>
    } @else {
      <cf-empty-state variant="tight" [heading]="empty().heading" [text]="empty().text" />
    }
  }
}

<cf-toast-region
  admin
  [toasts]="toastViews()"
  (dismissed)="dismissToast($event)"
  (paused)="toasts.pause($event)"
/>
