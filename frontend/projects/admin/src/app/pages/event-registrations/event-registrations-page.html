<cf-breadcrumb [items]="trail" (navigate)="navigate($event)" />

<div class="page-head">
  <div>
    <h1 class="admin-title">Registrations</h1>
    @if (title(); as eventTitle) {
      <p class="subtitle">{{ eventTitle }}</p>
    }
  </div>
</div>

@switch (state().kind) {
  @case ('loading') {
    <cf-skeleton-region label="Loading registrations">
      <cf-table
        caption="Registrations"
        [columns]="columns"
        [rows]="[]"
        [loading]="true"
        [loadingRows]="5"
      />
    </cf-skeleton-region>
  }
  @case ('failed') {
    <cf-empty-state
      variant="error"
      heading="Registrations didn't load"
      text="We couldn't reach the server. Try again in a moment."
    >
      <cf-button slot="actions" size="sm" (click)="tryAgain()">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
        </svg>
        Try again
      </cf-button>
    </cf-empty-state>
  }
  @default {
    @if (capacity(); as used) {
      <cf-progress-bar [label]="used.label" [value]="used.percent" />
    }
    @if (rows().length > 0) {
      <cf-table caption="Registrations" [columns]="columns" [rows]="rows()" />
    } @else {
      <cf-empty-state
        variant="tight"
        heading="No registrations yet"
        text="Members who register for this event appear here with the date they registered."
      />
    }
  }
}
