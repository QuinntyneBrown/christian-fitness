<div class="page-head">
  <h1 class="display admin-title">Dashboard</h1>
</div>

<section aria-labelledby="activity-title">
  <h2 class="display section-title" id="activity-title">Community activity</h2>
  @switch (state().kind) {
    @case ('loading') {
      <cf-skeleton-region label="Loading community activity">
        <cf-table
          caption="Community activity"
          [columns]="columns"
          [rows]="[]"
          [loading]="true"
          [loadingRows]="8"
        />
      </cf-skeleton-region>
    }
    @case ('failed') {
      <cf-empty-state
        variant="error"
        heading="Activity didn't load"
        text="We couldn't reach the server. Try again in a moment."
      >
        <cf-button slot="actions" size="sm" (click)="tryAgain()">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
          </svg>
          Try again
        </cf-button>
      </cf-empty-state>
    }
    @default {
      @if (quiet()) {
        <cf-empty-state
          variant="tight"
          heading="No activity yet"
          text="New members, registrations and messages show up here week by week."
        />
      } @else {
        <cf-table caption="Community activity" [columns]="columns" [rows]="rows()" />
      }
    }
  }
</section>
