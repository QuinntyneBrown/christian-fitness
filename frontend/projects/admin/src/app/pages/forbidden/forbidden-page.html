<cf-staff-layout
  heading="Staff only"
  lead="The admin console is for the Christian Fitness team, and this account doesn't have staff access right now."
  note="On the team? Ask a community director to give you staff access."
  noteIcon="none"
  focusHeading
  (submitted)="signOut()"
>
  <cf-button
    slot="submit"
    type="submit"
    size="lg"
    block
    [disabled]="signingOut()"
    [busy]="signingOut()"
  >
    @if (signingOut()) {
      Signing out…
    } @else {
      Sign out
    }
  </cf-button>
</cf-staff-layout>
