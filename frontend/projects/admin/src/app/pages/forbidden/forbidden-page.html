@if (role) {
  <cf-staff-layout
    heading="Admins only"
    lead="Events and Services are run by admins. As a moderator, you look after members from the Dashboard and Members."
    note="Need to manage events or services? Ask a community director to make you an admin."
    noteIcon="none"
    focusHeading
  >
    <cf-button slot="submit" href="/" size="lg" block>Go to dashboard</cf-button>
  </cf-staff-layout>
} @else {
  <cf-staff-layout
    heading="Staff only"
    lead="The admin console is for the Christian Fitness team, and this account doesn't have staff access right now."
    note="On the team? Ask a community director to give you staff access."
    noteIcon="none"
    focusHeading
    (submitted)="signOut()"
  >
    <cf-button
      slot="submit"
      type="submit"
      size="lg"
      block
      [disabled]="signingOut()"
      [busy]="signingOut()"
    >
      @if (signingOut()) {
        Signing out…
      } @else {
        Sign out
      }
    </cf-button>
  </cf-staff-layout>
}
