<cf-staff-layout
  heading="Staff only"
  lead="The admin console is for the Christian Fitness team, and this account doesn't have staff access right now."
  note="On the team? Ask a community director to give you staff access."
  noteIcon="none"
  focusHeading
  (submitted)="signOut()"
>
  <cf-button
    slot="submit"
    type="submit"
    size="lg"
    block
    [disabled]="signingOut()"
    [busy]="signingOut()"
  >
    @if (signingOut()) {
      <svg class="icon icon--spin" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg
      >Signing out…
    } @else {
      Sign out
    }
  </cf-button>
</cf-staff-layout>
