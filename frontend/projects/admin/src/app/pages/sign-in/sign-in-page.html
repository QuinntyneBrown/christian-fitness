<cf-staff-layout
  heading="Staff sign in"
  lead="For the Christian Fitness team only."
  note="Two-step verification required"
  (submitted)="submit()"
>
  @if (refusal() === 'invalid-credentials') {
    <cf-form-alert
      slot="alert"
      heading="Email or password is incorrect"
      text="Check both and try again."
    />
  } @else if (refusal() === 'not-staff') {
    <cf-form-alert
      slot="alert"
      heading="This account isn't on the team"
      text="The admin console is for the Christian Fitness team. On the team? Ask a community director to give you staff access."
    />
  } @else if (refusal() === 'failed') {
    <cf-form-alert
      slot="alert"
      heading="We couldn't sign you in"
      text="Something went wrong on our side. Try again in a moment."
    />
  }
  <cf-text-field
    slot="fields"
    fieldId="f-email"
    label="Work email"
    name="email"
    type="email"
    autocomplete="username"
    [value]="email()"
    [readonly]="submitting()"
    (valueChange)="email.set($event)"
  />
  <cf-text-field
    slot="fields"
    fieldId="f-password"
    label="Password"
    name="password"
    type="password"
    autocomplete="current-password"
    [value]="password()"
    [readonly]="submitting()"
    (valueChange)="password.set($event)"
  />
  <cf-button
    slot="submit"
    type="submit"
    size="lg"
    block
    [disabled]="submitting()"
    [busy]="submitting()"
  >
    @if (submitting()) {
      <svg class="icon icon--spin" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg
      >Signing in…
    } @else {
      Sign in
    }
  </cf-button>
</cf-staff-layout>
