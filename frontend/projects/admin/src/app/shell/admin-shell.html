<cf-admin-layout
  [items]="items()"
  [current]="current()"
  [userName]="staff()?.name ?? ''"
  [userRole]="staff()?.role ?? ''"
  [userInitials]="initials()"
  [signingOut]="signingOut()"
  (navigate)="navigate($event)"
  (signOut)="signOut()"
>
  @if (!network.online()) {
    <cf-banner
      slot="banner"
      tone="warning"
      lead="You're offline."
      text="Pages you've opened stay on screen. Check your connection to load new updates."
    />
  }
  <router-outlet />
</cf-admin-layout>
