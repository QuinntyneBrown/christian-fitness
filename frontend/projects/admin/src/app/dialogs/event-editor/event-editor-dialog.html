<cf-drawer
  [heading]="editing ? 'Edit event' : 'New event'"
  [titleId]="headingId"
  (closed)="close()"
>
  @if (errorItems().length > 0) {
    <cf-alert [heading]="errorHeading()" [items]="errorItems()" />
  } @else if (failed()) {
    <cf-alert [heading]="editing ? 'Couldn\'t save the changes' : 'Couldn\'t save the draft'">
      @if (editing) {
        The server didn't respond. Your changes are still here; try again.
      } @else {
        Check every field and try again. Your changes are still here.
      }
    </cf-alert>
  }
  <cf-text-field
    fieldId="f-title"
    label="Title"
    name="title"
    [value]="values().title"
    [error]="errors().title"
    [readonly]="saving()"
    (valueChange)="set('title', $event)"
  />
  <cf-select
    fieldId="f-category"
    label="Category"
    name="category"
    [options]="categories"
    [value]="values().category"
    [error]="errors().category"
    [disabled]="saving()"
    (valueChange)="setCategory($event)"
  />
  <cf-form-layout layout="grid">
    <cf-text-field
      fieldId="f-date"
      label="Date"
      name="date"
      type="date"
      [value]="values().date"
      [error]="errors().date"
      [readonly]="saving()"
      (valueChange)="set('date', $event)"
    />
    <cf-text-field
      fieldId="f-time"
      label="Start time"
      name="time"
      type="time"
      [value]="values().startTime"
      [error]="errors().startTime"
      [readonly]="saving()"
      (valueChange)="set('startTime', $event)"
    />
  </cf-form-layout>
  <cf-text-field
    fieldId="f-place"
    label="Place"
    name="place"
    [value]="values().place"
    [error]="errors().place"
    [readonly]="saving()"
    (valueChange)="set('place', $event)"
  />
  <cf-text-field
    fieldId="f-area"
    label="Area"
    name="area"
    hint="Neighbourhood and city, like Waterfront, Toronto"
    [value]="values().area"
    [error]="errors().area"
    [readonly]="saving()"
    (valueChange)="set('area', $event)"
  />
  <cf-form-layout layout="grid">
    <cf-text-field
      fieldId="f-price"
      label="Price"
      name="price"
      hint="Leave blank for free"
      [value]="values().price"
      [error]="errors().price"
      [readonly]="saving()"
      (valueChange)="set('price', $event)"
    />
    <cf-text-field
      fieldId="f-capacity"
      label="Capacity"
      name="capacity"
      type="number"
      inputmode="numeric"
      [min]="1"
      [value]="values().capacity"
      [error]="errors().capacity"
      [readonly]="saving()"
      (valueChange)="set('capacity', $event)"
    />
  </cf-form-layout>
  <cf-textarea
    fieldId="f-summary"
    label="Summary"
    name="summary"
    hint="Up to 1,000 characters"
    [value]="values().summary"
    [error]="errors().summary"
    [readonly]="saving()"
    (valueChange)="set('summary', $event)"
  />
  <cf-file-field
    fieldId="f-image"
    label="Image"
    name="image"
    optional
    hint="JPEG, PNG or WebP, up to 5 MB"
    [accept]="imageTypes"
    [fileName]="values().imageName"
    [error]="errors().image"
    [disabled]="saving() || uploading()"
    (fileChosen)="chooseImage($event)"
    (removed)="removeImage()"
  />
  <cf-button
    slot="foot"
    [variant]="editing ? 'primary' : 'secondary'"
    [busy]="saving()"
    [disabled]="saving() || uploading()"
    (click)="save()"
  >
    @if (saving()) {
      Saving…
    } @else if (editing) {
      Save changes
    } @else {
      Save draft
    }
  </cf-button>
</cf-drawer>
