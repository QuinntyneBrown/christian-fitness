<cf-drawer heading="New event" [headingId]="headingId" (dismiss)="close()">
  @if (failed()) {
    <cf-form-alert
      heading="Couldn't save the draft"
      text="Check every field and try again. Your changes are still here."
    />
  }
  <cf-text-field
    fieldId="f-title"
    label="Title"
    name="title"
    [value]="values().title"
    [readonly]="saving()"
    (valueChange)="set('title', $event)"
  />
  <cf-select-field
    fieldId="f-category"
    label="Category"
    name="category"
    [options]="categories"
    [value]="values().category"
    [disabled]="saving()"
    (valueChange)="setCategory($event)"
  />
  <div class="field-grid">
    <cf-text-field
      fieldId="f-date"
      label="Date"
      name="date"
      type="date"
      [value]="values().date"
      [readonly]="saving()"
      (valueChange)="set('date', $event)"
    />
    <cf-text-field
      fieldId="f-time"
      label="Start time"
      name="time"
      type="time"
      [value]="values().startTime"
      [readonly]="saving()"
      (valueChange)="set('startTime', $event)"
    />
  </div>
  <cf-text-field
    fieldId="f-place"
    label="Place"
    name="place"
    [value]="values().place"
    [readonly]="saving()"
    (valueChange)="set('place', $event)"
  />
  <cf-text-field
    fieldId="f-area"
    label="Area"
    name="area"
    hint="Neighbourhood and city, like Waterfront, Toronto"
    [value]="values().area"
    [readonly]="saving()"
    (valueChange)="set('area', $event)"
  />
  <div class="field-grid">
    <cf-text-field
      fieldId="f-price"
      label="Price"
      name="price"
      hint="Leave blank for free"
      [value]="values().price"
      [readonly]="saving()"
      (valueChange)="set('price', $event)"
    />
    <cf-text-field
      fieldId="f-capacity"
      label="Capacity"
      name="capacity"
      type="number"
      inputmode="numeric"
      [min]="1"
      [value]="values().capacity"
      [readonly]="saving()"
      (valueChange)="set('capacity', $event)"
    />
  </div>
  <cf-textarea-field
    fieldId="f-summary"
    label="Summary"
    name="summary"
    hint="Up to 1,000 characters"
    [value]="values().summary"
    [readonly]="saving()"
    (valueChange)="set('summary', $event)"
  />
  <cf-button
    slot="foot"
    variant="secondary"
    grow
    [busy]="saving()"
    [disabled]="saving()"
    (click)="saveDraft()"
  >
    @if (saving()) {
      <svg class="icon icon--spin" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-6.219-8.56" />
      </svg>
      Saving…
    } @else {
      Save draft
    }
  </cf-button>
</cf-drawer>
