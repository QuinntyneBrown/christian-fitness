<header class="masthead">
  <div class="masthead__bar">
    <cf-brand-lockup [href]="homeHref()" />
    <div class="masthead__actions">
      <span class="masthead__signin">
        <cf-button variant="ghost" [href]="signInHref()">Sign in</cf-button>
      </span>
      <cf-button [href]="joinHref()">Join free</cf-button>
    </div>
  </div>
  @if (sections().length) {
    <nav class="section-nav" aria-label="Sections">
      @for (section of sections(); track section.href) {
        <a
          class="section-nav__link"
          [href]="section.href"
          [attr.aria-current]="section.current ? 'page' : null"
          (click)="follow($event, section.href)"
          >{{ section.label }}</a
        >
      }
    </nav>
  }
</header>
