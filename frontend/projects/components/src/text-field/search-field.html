<label class="search">
  <svg class="icon search__icon" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="11" cy="11" r="8" />
    <path d="m21 21-4.3-4.3" />
  </svg>
  <span class="visually-hidden">{{ label() }}</span>
  <input
    class="search__input"
    type="search"
    [name]="name()"
    [attr.placeholder]="placeholder() ?? null"
    [value]="value()"
    (input)="onInput($event)"
    (keydown.escape)="onEscape($event)"
  />
</label>
