<cf-form-field
  [fieldId]="fieldId()"
  [label]="label()"
  [optional]="optional()"
  [hint]="hint()"
  [error]="error()"
  [errorLink]="errorLink()"
  [errorHref]="errorHref()"
>
  <ng-content select="[slot=label-action]" ngProjectAs="[slot=label-action]" />
  <input
    [attr.class]="code() ? 'input input--code' : 'input'"
    [id]="fieldId()"
    [name]="name()"
    [type]="type()"
    [attr.autocomplete]="autocomplete() ?? null"
    [attr.inputmode]="inputmode() ?? null"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="error() ? 'true' : null"
    [value]="value()"
    [readOnly]="readonly()"
    [disabled]="disabled()"
    (input)="onInput($event)"
  />
</cf-form-field>
