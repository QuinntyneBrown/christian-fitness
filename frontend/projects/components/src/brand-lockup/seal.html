<svg
  [attr.class]="classes()"
  viewBox="0 0 200 200"
  [attr.role]="decorative() ? null : 'img'"
  [attr.aria-label]="decorative() ? null : 'Christian Fitness'"
  [attr.aria-hidden]="decorative() ? 'true' : null"
>
  @if (lettered()) {
    <defs>
      <path
        [attr.id]="pathId"
        d="M100,100 m-76.5,0 a76.5,76.5 0 1,1 153,0 a76.5,76.5 0 1,1 -153,0"
      />
    </defs>
    <circle class="seal__ring" cx="100" cy="100" r="96" stroke-width="3" />
    <circle class="seal__ring" cx="100" cy="100" r="66" stroke-width="1.5" />
    <text class="seal__text">
      <textPath [attr.href]="'#' + pathId" startOffset="0" textLength="478" lengthAdjust="spacing">
        CHRISTIAN FITNESS · HEALTH · ENERGY · ABUNDANT LIFE ·
      </textPath>
    </text>
    <rect class="seal__cross" x="92" y="54" width="16" height="96" rx="1.5" />
    <rect class="seal__cross" x="68" y="78" width="64" height="15" rx="1.5" />
  } @else {
    <circle class="seal__ring" cx="100" cy="100" r="96" stroke-width="7" />
    <rect class="seal__cross" x="88" y="38" width="24" height="128" rx="2" />
    <rect class="seal__cross" x="56" y="70" width="88" height="22" rx="2" />
  }
</svg>
