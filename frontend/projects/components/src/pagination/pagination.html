<nav class="pagination" aria-label="Pagination">
  @if (summary(); as range) {
    <p class="pagination__summary">{{ range }}</p>
  }
  <ol class="pagination__list">
    <li>
      @if (page() > 1) {
        <a
          class="pagination__link"
          [href]="hrefFor()(page() - 1)"
          aria-label="Previous page"
          (click)="follow($event, page() - 1)"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
        </a>
      } @else {
        <a class="pagination__link" aria-label="Previous page" aria-disabled="true">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
        </a>
      }
    </li>
    @for (item of items(); track $index) {
      @if (item === 'gap') {
        <li class="pagination__number pagination__gap" aria-hidden="true">…</li>
      } @else {
        <li class="pagination__number">
          <a
            class="pagination__link"
            [href]="hrefFor()(item)"
            [attr.aria-label]="'Page ' + item"
            [attr.aria-current]="item === page() ? 'page' : null"
            (click)="follow($event, item)"
            >{{ item }}</a
          >
        </li>
      }
    }
    <li class="pagination__page-only">Page {{ page() }} of {{ pageCount() }}</li>
    <li>
      @if (page() < pageCount()) {
        <a
          class="pagination__link"
          [href]="hrefFor()(page() + 1)"
          aria-label="Next page"
          (click)="follow($event, page() + 1)"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
        </a>
      } @else {
        <a class="pagination__link" aria-label="Next page" aria-disabled="true">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
        </a>
      }
    </li>
  </ol>
</nav>
