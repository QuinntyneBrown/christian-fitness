<div [attr.class]="unread() ? 'note note--unread' : 'note'">
  <a class="note__link" [href]="href()" (click)="follow($event)">
    <span class="note__icon" aria-hidden="true">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        @switch (icon()) {
          @case ('clock') {
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          }
          @case ('calendar-plus') {
            <path d="M8 2v4" />
            <path d="M16 2v4" />
            <path d="M21 13V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8" />
            <path d="M3 10h18" />
            <path d="M16 19h6" />
            <path d="M19 16v6" />
          }
          @default {
            <path d="M8 2v4" />
            <path d="M16 2v4" />
            <path d="M21 13V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8" />
            <path d="M3 10h18" />
            <path d="m17 22 5-5" />
            <path d="m17 17 5 5" />
          }
        }
      </svg>
    </span>
    <span class="note__body">
      <span class="note__title">{{ heading() }}</span>
      @if (text()) {
        <span class="note__text">{{ text() }}</span>
      }
      <span class="note__time">{{ time() }}</span>
    </span>
    @if (unread()) {
      <span class="note__dot"><cf-unread-dot label="Unread" /></span>
    }
  </a>
</div>
