@if (nav()) {
  <nav [attr.class]="classes()" [attr.aria-label]="label()">
    <ng-container [ngTemplateOutlet]="chips" />
  </nav>
} @else {
  <div [attr.class]="classes()" role="group" [attr.aria-label]="label()">
    <ng-container [ngTemplateOutlet]="chips" />
  </div>
}
<ng-template #chips>
  <ng-content />
  @if (divided()) {
    <span class="chip-bar__divider" aria-hidden="true"></span>
  }
  <ng-content select="[slot=after]" />
</ng-template>
