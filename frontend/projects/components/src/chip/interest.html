<button
  class="interest"
  type="button"
  [attr.aria-pressed]="pressed() ? 'true' : 'false'"
  [disabled]="disabled()"
  (click)="toggle()"
>
  @if (check() && pressed()) {
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
  }
  <ng-content />
</button>
