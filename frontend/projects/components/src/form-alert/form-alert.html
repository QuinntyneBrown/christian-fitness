<div class="form-alert" role="alert" tabindex="-1">
  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="10" />
    <line x1="12" x2="12" y1="8" y2="12" />
    <line x1="12" x2="12.01" y1="16" y2="16" />
  </svg>
  <div>
    <p class="form-alert__title">{{ heading() }}</p>
    @if (text(); as sentence) {
      <p>
        {{ sentence }}
        @if (link(); as label) {
          <a class="inline-link" [href]="linkHref()">{{ label }}</a>
        }
      </p>
    }
    @if (items().length) {
      <ul class="form-alert__list">
        @for (item of items(); track item.target) {
          <li>
            <a [href]="'#' + item.target" (click)="focusField($event, item.target)">{{
              item.text
            }}</a>
          </li>
        }
      </ul>
    }
  </div>
</div>
