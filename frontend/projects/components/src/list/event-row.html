@if (loading()) {
  <div class="event-row">
    <cf-skeleton shape="date" />
    <div class="event-row__body event-row__lines">
      <cf-skeleton width="55" />
      <cf-skeleton shape="text-sm" width="40" />
    </div>
    <cf-skeleton shape="text-sm" />
  </div>
} @else {
  <ng-template #row>
    <div class="event-row__date">
      <p class="event-row__month">{{ month() }}</p>
      <p class="event-row__day">{{ day() }}</p>
    </div>
    <div class="event-row__body">
      <p [attr.class]="wrap() ? 'event-row__title event-row__title--wrap' : 'event-row__title'">
        {{ heading() }}
      </p>
      <p class="event-row__meta">{{ meta() }}</p>
    </div>
    @if (end(); as value) {
      <span [attr.class]="going() ? 'event-row__end event-row__end--going' : 'event-row__end'">{{
        value
      }}</span>
    }
  </ng-template>
  @if (href()) {
    <a [attr.class]="large() ? 'event-row event-row--lg' : 'event-row'" [href]="href()">
      <ng-container [ngTemplateOutlet]="row" />
    </a>
  } @else {
    <div [attr.class]="large() ? 'event-row event-row--lg' : 'event-row'">
      <ng-container [ngTemplateOutlet]="row" />
    </div>
  }
}
