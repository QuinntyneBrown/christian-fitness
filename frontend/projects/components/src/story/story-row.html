@if (loading()) {
  <div class="story-row">
    <div class="story-row__body story-row__lines">
      <cf-skeleton shape="text-sm" width="30" />
      <cf-skeleton shape="title" />
      <cf-skeleton width="80" />
    </div>
    <span class="story-row__image"><cf-skeleton shape="tile" /></span>
  </div>
} @else {
  <div class="story-row">
    <div class="story-row__body">
      <p class="story__section">
        {{ section() }} <span class="story__ago">· {{ age() }}</span>
      </p>
      <h3 class="story-row__title">
        <a class="story-link" [href]="href()">{{ heading() }}</a>
      </h3>
      @if (summary()) {
        <p class="story-row__dek">{{ summary() }}</p>
      }
      <p class="story__meta">{{ author() }}</p>
    </div>
    @if (image(); as src) {
      <img class="story-row__image" [src]="src" alt="" width="448" height="336" loading="lazy" />
    }
  </div>
}
