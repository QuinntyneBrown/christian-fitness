<div class="feedback-detail">
  <div class="feedback-detail__head">
    <span class="kind-tag">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        @switch (kind()) {
          @case ('problem') {
            <path d="m8 2 1.88 1.88" />
            <path d="M14.12 3.88 16 2" />
            <path d="M9 7.13v-1a3.003 3.003 0 1 1 6 0v1" />
            <path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6" />
            <path d="M12 20v-9" />
            <path d="M6.53 9C4.6 8.8 3 7.1 3 5" />
            <path d="M6 13H2" />
            <path d="M3 21c0-2.1 1.7-3.9 3.8-4" />
            <path d="M20.97 5c0 2.1-1.6 3.8-3.5 4" />
            <path d="M22 13h-4" />
            <path d="M17.2 17c2.1.1 3.8 1.9 3.8 4" />
          }
          @case ('correction') {
            <path d="M12 20h9" />
            <path
              d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"
            />
          }
          @case ('thanks') {
            <path
              d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"
            />
          }
          @default {
            <path
              d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"
            />
            <path d="M9 18h6" />
            <path d="M10 22h4" />
          }
        }</svg
      >{{ kindLabel() }}</span
    >
    <cf-status [variant]="statusVariant()">{{ statusLabel() }}</cf-status>
    <span class="feedback-detail__when">{{ when() }}</span>
  </div>
  <h2 class="visually-hidden">{{ kindLabel() }} from {{ fromName() }}</h2>
  <p class="feedback-detail__text">{{ text() }}</p>
  <dl class="feedback-detail__facts">
    <div class="feedback-detail__from">
      <cf-avatar size="sm" [name]="fromName()" [initials]="initials()" />
      <div>
        <dt class="visually-hidden">From</dt>
        <dd class="feedback-detail__strong">
          {{ fromName() }}
          @if (suspended()) {
            <cf-status variant="suspended">Suspended</cf-status>
          }
        </dd>
        <dd class="feedback-detail__sub">{{ fromEmail() }}</dd>
      </div>
    </div>
    <div>
      <dt>Sent from</dt>
      <dd class="feedback-detail__strong">{{ sentFrom() }}</dd>
    </div>
    <div>
      <dt>Device</dt>
      <dd class="feedback-detail__strong feedback-detail__device">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect width="20" height="14" x="2" y="3" rx="2" />
          <line x1="8" x2="16" y1="21" y2="21" />
          <line x1="12" x2="12" y1="17" y2="21" /></svg
        >{{ device() }}
      </dd>
    </div>
  </dl>
  <ng-content />
</div>
