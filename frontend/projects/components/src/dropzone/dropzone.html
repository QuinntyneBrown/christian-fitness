<button
  class="dropzone"
  type="button"
  [disabled]="disabled()"
  [attr.aria-busy]="busy() ? 'true' : null"
  [attr.aria-labelledby]="busy() ? null : titleId"
  [attr.aria-describedby]="hint() && !busy() ? hintId : null"
  [attr.data-state]="over() ? 'dragover' : null"
  (click)="choose()"
  (dragover)="dragOver($event)"
  (dragleave)="over.set(false)"
  (drop)="dropped($event)"
>
  @if (busy()) {
    <span class="dropzone__title">{{ busyLabel() }}</span>
  } @else {
    <svg class="icon dropzone__icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M16 5h6" />
      <path d="M19 2v6" />
      <path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5" />
      <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
      <circle cx="9" cy="9" r="2" />
    </svg>
    <span class="dropzone__title" [id]="titleId">{{ title() }}</span>
    @if (hint()) {
      <span class="dropzone__hint" [id]="hintId">{{ hint() }}</span>
    }
  }
</button>
<input
  type="file"
  hidden
  tabindex="-1"
  [attr.accept]="accept() || null"
  [disabled]="disabled()"
  (change)="picked($event)"
/>
