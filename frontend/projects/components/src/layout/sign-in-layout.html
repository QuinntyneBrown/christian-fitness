<div class="signin">
  <header class="signin__header"><cf-brand-lockup href="/" /></header>
  <main id="main" class="signin__main">
    <div class="signin__card">
      <h1 class="display auth__title">{{ heading() }}</h1>
      <p class="auth__lead">{{ lead() }}</p>
      <div class="auth__alert"><ng-content select="[slot=alert]" /></div>
      <div class="auth__sso"><ng-content select="[slot=sso]" /></div>
      <form class="auth__fields" novalidate (submit)="onSubmit($event)">
        <ng-content select="[slot=fields]" />
        <div class="auth__submit"><ng-content select="[slot=submit]" /></div>
      </form>
      <p class="auth__alt">
        {{ altText() }} <a [href]="altHref()">{{ altLink() }}</a>
      </p>
    </div>
  </main>
</div>
