<div [attr.class]="classes()" role="alert" tabindex="-1">
  @if (heading(); as heading) {
    <p class="sso-notice__title">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" x2="12" y1="8" y2="12" />
        <line x1="12" x2="12.01" y1="16" y2="16" />
      </svg>
      {{ heading }}
    </p>
  }
  <p class="sso-notice__account">
    <cf-google-mark size="sm" /><span>{{ account() }}</span>
  </p>
  <p class="sso-notice__text"><ng-content /></p>
  <div class="sso-notice__actions"><ng-content select="[slot=actions]" /></div>
</div>
