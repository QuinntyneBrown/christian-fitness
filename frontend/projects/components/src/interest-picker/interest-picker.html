<fieldset>
  <legend class="field__legend">{{ legend() }}</legend>
  <div class="interest-list">
    @for (option of options(); track option.key) {
      <button
        class="interest"
        type="button"
        [attr.aria-pressed]="selected().includes(option.key)"
        [disabled]="disabled()"
        (click)="toggled.emit(option.key)"
      >
        {{ option.label }}
      </button>
    }
  </div>
</fieldset>
