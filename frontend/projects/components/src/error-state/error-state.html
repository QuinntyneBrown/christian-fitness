<div class="error-state" role="alert">
  <span class="error-state__icon"
    ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="10" />
      <line x1="12" x2="12" y1="8" y2="12" />
      <line x1="12" x2="12.01" y1="16" y2="16" /></svg
  ></span>
  <div>
    <h2 class="empty-state__title">{{ heading() }}</h2>
    <p class="empty-state__text">{{ text() }}</p>
    <div class="empty-state__actions">
      <cf-button size="sm" (click)="retry.emit()"
        ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" /></svg
        >Try again</cf-button
      >
      <cf-button size="sm" variant="secondary" [href]="backHref()">{{ backLabel() }}</cf-button>
    </div>
  </div>
</div>
