<div class="join-card">

  <p class="join-card__text">{{ text() }}</p>
  <div class="join-card__action">
    <cf-button variant="inverse" [href]="href()"
      >{{ action() }}
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">

    ></cf-button>
  </div>
</div>
