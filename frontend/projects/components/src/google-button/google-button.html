<button
  class="google-button"
  type="button"
  [disabled]="busy()"
  [attr.aria-busy]="busy() ? 'true' : null"
  (click)="chosen.emit()"
>
  @if (busy()) {
    <svg class="icon icon--spin" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg
    >Opening Google…
  } @else {
    <cf-google-mark />{{ label() }}
  }
</button>
