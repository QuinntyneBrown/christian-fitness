<a class="hosting-row" [href]="href()" (click)="follow($event)">
  <img class="hosting-row__image" [src]="imageSrc()" alt="" width="1376" height="768" />
  <span class="hosting-row__body">
    <span class="hosting-row__meta">
      @if (series()) {
        <svg class="icon icon--xs" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m17 2 4 4-4 4" />
          <path d="M3 11v-1a4 4 0 0 1 4-4h14" />
          <path d="m7 22-4-4 4-4" />
          <path d="M21 13v1a4 4 0 0 1-4 4H3" />
        </svg>
      }
      {{ meta() }}</span
    >
    <span class="display hosting-row__title">{{ heading() }}</span>
    <span class="hosting-row__sub">{{ sub() }}</span>
  </span>
  <svg class="icon hosting-row__arrow" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M5 12h14" />
    <path d="m12 5 7 7-7 7" />
  </svg>
</a>
