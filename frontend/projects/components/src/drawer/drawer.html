<div class="scrim" aria-hidden="true" (click)="closed.emit()"></div>
<div class="drawer">
  <div class="drawer__head">
    <h2 class="drawer__title" [id]="titleId()">{{ heading() }}</h2>
    <button
      class="drawer__close"
      type="button"
      [attr.aria-label]="closeLabel()"
      (click)="closed.emit()"
    >
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
    </button>
  </div>
  <div class="drawer__body"><ng-content /></div>
  <div class="drawer__foot"><ng-content select="[slot=foot]" /></div>
</div>
