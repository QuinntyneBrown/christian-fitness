<figure class="asset">
  <cf-pick-art [shape]="shape()" [label]="artLabel()" [rendered]="src()" />
  <figcaption class="asset__caption">
    <span class="asset__label">{{ label() }}</span>
    <cf-button variant="secondary" size="xs" (click)="save.emit()">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="7 10 12 15 17 10" />
        <line x1="12" x2="12" y1="15" y2="3" />
      </svg>
      PNG<span class="visually-hidden">: {{ fileName() }}</span>
    </cf-button>
  </figcaption>
</figure>
