<div class="caption">
  <div class="caption__head">
    <h3 class="caption__title">Caption</h3>
    <cf-button variant="neutral" size="xs" (click)="copyCaption.emit()">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
      </svg>
      @if (copied()) {
        Copied
      } @else {
        Copy
      }
      <span class="visually-hidden">&ngsp;caption</span>
    </cf-button>
  </div>
  <pre class="caption__text">{{ text() }}</pre>
  @if (hint(); as hint) {
    <p class="caption__hint">{{ hint }}</p>
  }
  <p class="visually-hidden" role="status">
    @if (copied()) {
      Caption copied
    }
  </p>
</div>
