<a class="event-card" [href]="href()">
  <div class="event-card__media">
    <img
      class="event-card__image"
      [src]="imageSrc()"
      alt=""
      [width]="imageWidth()"
      [height]="imageHeight()"
      loading="lazy"
    />
    <cf-date-badge [month]="month()" [day]="day()" />
    @if (registered()) {
      <span class="going-pill">Going</span>
    }
  </div>
  <div class="event-card__body">
    <p class="event-card__meta">
      {{ type() }} · <span class="visually-hidden">{{ date() }}, </span>{{ time() }}
    </p>
    @if (headingLevel() === 3) {
      <h3 class="event-card__title">{{ heading() }}</h3>
    } @else {
      <h2 class="event-card__title">{{ heading() }}</h2>
    }
    <p class="event-card__place">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"
        />
        <circle cx="12" cy="10" r="3" />
      </svg>
      <span>{{ place() }}</span>
    </p>
    <div class="event-card__spacer"></div>
    <div class="event-card__foot">
      <span class="event-card__going">{{ going() }} going</span>
      <span [attr.class]="end().scarce ? 'event-card__left' : 'event-card__price'">{{
        end().text
      }}</span>
    </div>
  </div>
</a>
