<div
  [attr.class]="'banner banner--' + tone()"
  [attr.role]="tone() === 'danger' ? 'alert' : 'status'"
>
  <div class="banner__inner">
    <svg class="icon banner__icon" viewBox="0 0 24 24" aria-hidden="true">
      @switch (glyph()) {
        @case ('mail') {
          <rect width="20" height="16" x="2" y="4" rx="2" />
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
        }
        @case ('check') {
          <circle cx="12" cy="12" r="10" />
          <path d="m9 12 2 2 4-4" />
        }
        @case ('wifi-off') {
          <path d="M12 20h.01" />
          <path d="M8.5 16.43a5 5 0 0 1 7 0" />
          <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
          <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
          <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
          <path d="M5 13a10 10 0 0 1 5.24-2.76" />
          <path d="m2 2 20 20" />
        }
        @case ('alert') {
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
          <path d="M12 9v4" />
          <path d="M12 17h.01" />
        }
        @case ('wrench') {
          <path
            d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
          />
        }
        @default {
          <circle cx="12" cy="12" r="10" />
          <path d="M12 16v-4" />
          <path d="M12 8h.01" />
        }
      }
    </svg>
    <p class="banner__text">
      <strong>{{ lead() }}</strong>
      @if (text(); as detail) {
        {{ detail }}
      }
    </p>
    @if (actionLabel(); as label) {
      @if (actionHref(); as href) {
        <a class="banner__action" [href]="href">{{ label }}</a>
      } @else {
        <button class="banner__action" type="button" (click)="action.emit()">{{ label }}</button>
      }
    }
    @if (dismissible()) {
      <button class="banner__close" type="button" aria-label="Dismiss" (click)="dismissed.emit()">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    }
  </div>
</div>
