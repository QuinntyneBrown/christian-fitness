<ul class="going-list">
  @for (item of items(); track item.href) {
    <li>
      <a class="going-item" [href]="item.href">
        @if (item.imageUrl; as image) {
          <img class="going-item__image" [src]="image" alt="" width="128" height="72" />
        }
        <div class="mini-row__body">
          <p class="going-item__date">{{ item.date }}</p>
          <p class="mini-row__name">{{ item.title }}</p>
        </div>
      </a>
    </li>
  }
</ul>
