<div class="auth">
  <cf-auth-brand />
  <main id="main" class="auth__main">
    <form class="auth__form" novalidate (submit)="onSubmit($event)">
      <h1 class="display auth__title">{{ heading() }}</h1>
      <p class="auth__lead">{{ lead() }}</p>
      <div class="auth__alert"><ng-content select="[slot=alert]" /></div>
      <div class="auth__fields"><ng-content select="[slot=fields]" /></div>
      <div class="auth__submit"><ng-content select="[slot=submit]" /></div>
      <p class="auth__alt">
        {{ altText() }}&ngsp;<a [href]="altHref()">{{ altLink() }}</a>
      </p>
    </form>
  </main>
</div>
