<div [attr.class]="'toast toast--' + tone()">
  <svg class="icon toast__icon" viewBox="0 0 24 24" aria-hidden="true">
    @switch (tone()) {
      @case ('success') {
        <circle cx="12" cy="12" r="10" />
        <path d="m9 12 2 2 4-4" />
      }
      @case ('warning') {
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
        <path d="M12 9v4" />
        <path d="M12 17h.01" />
      }
      @case ('danger') {
        <circle cx="12" cy="12" r="10" />
        <line x1="12" x2="12" y1="8" y2="12" />
        <line x1="12" x2="12.01" y1="16" y2="16" />
      }
      @default {
        <circle cx="12" cy="12" r="10" />
        <path d="M12 16v-4" />
        <path d="M12 8h.01" />
      }
    }
  </svg>
  <div class="toast__body">
    <p class="toast__title">{{ heading() }}</p>
    @if (text(); as detail) {
      <p class="toast__text">{{ detail }}</p>
    }
    @if (actionLabel(); as label) {
      @if (actionHref(); as href) {
        <a class="toast__action" [href]="href">{{ label }}</a>
      } @else {
        <button class="toast__action" type="button" (click)="action.emit()">{{ label }}</button>
      }
    }
  </div>
  <button class="toast__close" type="button" aria-label="Dismiss" (click)="dismissed.emit()">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M18 6 6 18" />
      <path d="m6 6 12 12" />
    </svg>
  </button>
</div>
