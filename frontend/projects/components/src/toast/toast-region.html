<section
  [attr.class]="admin() ? 'toast-region toast-region--admin' : 'toast-region'"
  [attr.aria-label]="label()"
  (pointerenter)="hover(true)"
  (pointerleave)="hover(false)"
  (focusin)="focusIn()"
  (focusout)="focusOut($event)"
>
  <div class="toast-region__polite" role="status" aria-live="polite">
    @for (toast of polite(); track toast.id) {
      <cf-toast
        [tone]="toast.tone"
        [heading]="toast.heading"
        [text]="toast.text"
        [actionLabel]="toast.actionLabel"
        [actionHref]="toast.actionHref"
        (action)="action.emit(toast.id)"
        (dismissed)="dismissed.emit(toast.id)"
      />
    }
  </div>
  @for (toast of failures(); track toast.id) {
    <div role="alert">
      <cf-toast
        [tone]="toast.tone"
        [heading]="toast.heading"
        [text]="toast.text"
        [actionLabel]="toast.actionLabel"
        [actionHref]="toast.actionHref"
        (action)="action.emit(toast.id)"
        (dismissed)="dismissed.emit(toast.id)"
      />
    </div>
  }
</section>
