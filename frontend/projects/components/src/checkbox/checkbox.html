@if (variant() === 'choice') {
  <label class="choice">
    <input
      class="choice__input"
      type="checkbox"
      [attr.name]="name() ?? null"
      [attr.value]="value() ?? null"
      [checked]="checked()"
      [indeterminate]="indeterminate()"
      [disabled]="disabled()"
      [attr.aria-invalid]="invalid() ? 'true' : null"
      (change)="onChange($event)"
    />
    <span>
      <span class="choice__label">{{ label() }}</span>
      @if (description(); as text) {
        &ngsp;<span class="choice__desc">{{ text }}</span>
      }
    </span>
  </label>
} @else {
  <label [attr.class]="variant() === 'form' ? 'check check--ui' : 'check'">
    <input
      class="check__box"
      type="checkbox"
      [attr.name]="name() ?? null"
      [attr.value]="value() ?? null"
      [checked]="checked()"
      [indeterminate]="indeterminate()"
      [disabled]="disabled()"
      [attr.aria-invalid]="invalid() ? 'true' : null"
      (change)="onChange($event)"
    />
    {{ label() }}
  </label>
}
