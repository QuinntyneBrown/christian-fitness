<nav class="side-nav" [attr.aria-label]="label()">
  @if (!untitled()) {
    <p class="side-nav__title">{{ label() }}</p>
  }
  <ol class="side-nav__list" [attr.role]="numbered() ? null : 'list'">
    @for (entry of entries(); track entry.id) {
      <li>
        <a
          [attr.class]="numbered() ? 'side-nav__link side-nav__link--numbered' : 'side-nav__link'"
          [href]="route() + '#' + entry.id"
        >
          @if (numbered()) {
            <span class="side-nav__n">{{ $index + 1 }}.</span>
          }
          {{ entry.title }}</a
        >
      </li>
    }
  </ol>
</nav>
