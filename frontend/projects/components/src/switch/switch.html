<label
  [attr.class]="start() ? 'switch switch--start' : 'switch'"
  [attr.aria-busy]="busy() ? 'true' : null"
>
  <span class="switch__text">
    <span class="switch__label">{{ label() }}</span>
    @if (description(); as text) {
      &ngsp;<span class="switch__desc">{{ text }}</span>
    }
  </span>
  <input
    class="switch__input"
    type="checkbox"
    role="switch"
    [attr.name]="name() ?? null"
    [checked]="checked()"
    [disabled]="disabled()"
    (change)="onChange($event)"
  />
</label>
