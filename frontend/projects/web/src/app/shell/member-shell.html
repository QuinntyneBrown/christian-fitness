<cf-skip-link />
<cf-top-bar
  homeHref="/home"
  profileHref="/profile"
  notificationsHref="/notifications"
  [notificationsUnread]="notifications.unread()"
  [notificationsCurrent]="onNotifications()"
  [profileInitials]="initials()"
  [destinations]="destinations"
  [current]="current()"
  [unread]="inbox.unread()"
  [signingOut]="signingOut()"
  (navigate)="navigate($event)"
  (signOut)="signOut()"
/>
<cf-legal-change />
@if (!network.online()) {
  <cf-banner
    tone="warning"
    lead="You're offline."
    text="Pages you've opened stay on screen. Check your connection to load new updates."
  />
}
<div class="member-shell__body">
  <router-outlet />
</div>
@if (current() !== 'messages') {
  <cf-footer variant="member" />
}
<cf-tab-bar
  [destinations]="destinations"
  [current]="current()"
  [unread]="inbox.unread()"
  (navigate)="navigate($event)"
/>
