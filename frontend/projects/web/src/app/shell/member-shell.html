<cf-skip-link />
<cf-top-bar
  homeHref="/home"
  profileHref="/profile"
  [profileInitials]="initials()"
  [destinations]="destinations"
  [current]="current()"
  [unread]="inbox.unread()"
  [signingOut]="signingOut()"
  (navigate)="navigate($event)"
  (signOut)="signOut()"
/>
@if (!network.online()) {
  <cf-banner
    tone="warning"
    lead="You're offline."
    text="Pages you've opened stay on screen. Check your connection to load new updates."
  />
}
<div class="member-shell__body">
  <router-outlet />
</div>
<cf-tab-bar
  [destinations]="destinations"
  [current]="current()"
  [unread]="inbox.unread()"
  (navigate)="navigate($event)"
/>
