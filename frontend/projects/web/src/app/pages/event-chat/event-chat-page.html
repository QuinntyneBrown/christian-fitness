<main id="main" class="chat-page">
  @if (state() === 'open') {
    <header class="chat-page__head">
      <cf-link [href]="eventHref()" variant="back">Back to event</cf-link>
      <div class="chat-page__who">
        <h1 class="chat-page__name">{{ title() }}</h1>
        <p class="chat-page__sub">Event group</p>
      </div>
    </header>
    <cf-thread [label]="'Conversation with ' + title()" [entries]="entries()" />
    @if (sendFailed()) {
      <p class="chat-page__error" role="alert">That message couldn't be sent. Try again.</p>
    }
    <cf-composer [label]="'Message ' + title()" (send)="send($event)" />
  } @else if (state() === 'connecting') {
    <cf-skeleton-region label="Opening chat" heading>
      <cf-skeleton shape="title" width="30" />
      <cf-skeleton shape="text" width="80" />
      <cf-skeleton shape="text" width="50" />
    </cf-skeleton-region>
  } @else if (state() === 'refused') {
    <cf-empty-state
      variant="error"
      heading="You're not in this group chat"
      text="Only members registered for the event can read and send messages here."
    >
      <cf-button slot="actions" size="sm" [href]="eventHref()">Back to event</cf-button>
    </cf-empty-state>
  } @else {
    <cf-empty-state
      variant="error"
      heading="This chat didn't open"
      text="We couldn't reach the chat. Check your connection and try again."
    >
      <cf-button slot="actions" size="sm" (click)="retry()">Try again</cf-button>
      <cf-button slot="actions" size="sm" variant="secondary" [href]="eventHref()"
        >Back to event</cf-button
      >
    </cf-empty-state>
  }
</main>
