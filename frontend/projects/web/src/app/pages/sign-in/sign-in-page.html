<cf-auth-layout
  heading="Welcome back"
  lead="Sign in to see your events and messages."
  altText="New here?"
  altLink="Create a profile"
  altHref="/join"
  (submitted)="submit()"
>
  @if (refusal() === 'invalid-credentials') {
    <cf-form-alert
      slot="alert"
      heading="Email or password is incorrect"
      text="Check both and try again."
    />
  } @else if (refusal() === 'failed') {
    <cf-form-alert
      slot="alert"
      heading="We couldn't sign you in"
      text="Something went wrong on our side. Try again in a moment."
    />
  }
  <cf-text-field
    slot="fields"
    fieldId="f-email"
    label="Email"
    name="email"
    type="email"
    autocomplete="email"
    [value]="email()"
    [readonly]="submitting()"
    (valueChange)="email.set($event)"
  />
  <div slot="fields">
    <cf-text-field
      fieldId="f-password"
      label="Password"
      name="password"
      type="password"
      autocomplete="current-password"
      [value]="password()"
      [readonly]="submitting()"
      (valueChange)="password.set($event)"
    />
    <p class="sign-in-page__forgot">
      <cf-text-link href="/forgot-password">Forgot your password?</cf-text-link>
    </p>
  </div>
  <cf-button
    slot="submit"
    type="submit"
    size="lg"
    block
    [disabled]="submitting()"
    [busy]="submitting()"
  >
    @if (submitting()) {
      <svg class="icon icon--spin" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg
      >Signing in…
    } @else {
      Sign in
    }
  </cf-button>
</cf-auth-layout>
