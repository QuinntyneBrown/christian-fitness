<main id="main" class="messages-page">
  <cf-container page="default">
    <h1 class="display page-title">Messages</h1>
    @if (state() === 'loading') {
      <cf-skeleton-region label="Loading messages">
        <cf-list variant="mini" [items]="skeletons" [template]="skeletonRow" />
      </cf-skeleton-region>
    } @else if (state() === 'failed') {
      <cf-empty-state
        variant="error"
        heading="Messages didn't load"
        text="We couldn't reach the chat service. New messages are safe and will appear when you're reconnected."
      >
        <cf-button slot="actions" size="sm" (click)="retry()">Try again</cf-button>
      </cf-empty-state>
    } @else if (rows().length === 0) {
      <cf-empty-state
        variant="tight"
        heading="No messages yet"
        text="Register for an event and you'll join its group chat. You can also message a professional from Services."
      >
        <cf-button slot="actions" size="sm" href="/events">Browse events</cf-button>
      </cf-empty-state>
    } @else {
      <cf-list variant="mini" label="Conversations" [items]="rows()" [template]="conversationRow" />
    }
  </cf-container>
</main>
<ng-template #conversationRow let-row>
  <cf-mini-row
    conversation
    [href]="row.href"
    [name]="row.name"
    [meta]="row.meta"
    [text]="row.text"
    [time]="row.time"
    [unread]="row.unread"
  >
    <cf-avatar slot="avatar" [name]="row.name" [variant]="row.group ? 'group' : 'default'" />
  </cf-mini-row>
</ng-template>
<ng-template #skeletonRow>
  <div class="messages-page__skeleton">
    <cf-skeleton shape="avatar" />
    <div class="messages-page__skeleton-lines">
      <cf-skeleton shape="text" width="40" />
      <cf-skeleton shape="text-sm" width="80" />
    </div>
  </div>
</ng-template>
