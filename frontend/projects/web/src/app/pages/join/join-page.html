<cf-auth-layout
  heading="Create your profile"
  lead="Free for everyone. Takes about a minute."
  altText="Already a member?"
  altLink="Sign in"
  altHref="/sign-in"
  (submitted)="submit()"
>
  <cf-text-field
    slot="fields"
    fieldId="f-name"
    label="Full name"
    name="name"
    autocomplete="name"
    [value]="fullName()"
    [readonly]="submitting()"
    (valueChange)="fullName.set($event)"
  />
  <cf-text-field
    slot="fields"
    fieldId="f-email"
    label="Email"
    name="email"
    type="email"
    autocomplete="email"
    [value]="email()"
    [readonly]="submitting()"
    (valueChange)="email.set($event)"
  />
  <cf-text-field
    slot="fields"
    fieldId="f-password"
    label="Password"
    name="password"
    type="password"
    autocomplete="new-password"
    hint="At least 8 characters"
    [value]="password()"
    [readonly]="submitting()"
    (valueChange)="password.set($event)"
  />
  <cf-text-field
    slot="fields"
    fieldId="f-church"
    label="Home church"
    name="church"
    hint="Optional — helps you find people nearby"
    [value]="homeChurch()"
    [readonly]="submitting()"
    (valueChange)="homeChurch.set($event)"
  />
  <cf-interest-picker
    slot="fields"
    legend="What are you into?"
    [options]="options"
    [selected]="interests()"
    [disabled]="submitting()"
    (toggled)="toggle($event)"
  />
  <cf-button
    slot="submit"
    type="submit"
    size="lg"
    block
    [disabled]="submitting()"
    [busy]="submitting()"
  >
    @if (submitting()) {
      <svg class="icon icon--spin" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg
      >Creating your profile…
    } @else {
      Create profile
    }
  </cf-button>
</cf-auth-layout>
