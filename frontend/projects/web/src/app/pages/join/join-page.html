<cf-auth-layout
  heading="Create your profile"
  lead="Free for everyone. Takes about a minute."
  altText="Already a member?"
  altLink="Sign in"
  altHref="/sign-in"
  (submitted)="submit()"
>
  @if (summary().length) {
    <cf-form-alert slot="alert" heading="Check your details" [items]="summary()" />
  } @else if (refusal() === 'refused') {
    <cf-form-alert
      slot="alert"
      heading="Check your details"
      text="Some of your details weren't accepted. Check each field and try again."
    />
  } @else if (refusal() === 'rate-limited') {
    <cf-form-alert
      slot="alert"
      heading="Too many new profiles"
      text="Too many profiles were made from this network in the last hour. Try again later."
    />
  } @else if (refusal() === 'failed') {
    <cf-form-alert
      slot="alert"
      heading="We couldn't create your profile"
      text="Our servers didn't respond. Everything you typed is still here, so try again in a moment."
    />
  }
  <cf-text-field
    slot="fields"
    fieldId="f-name"
    label="Full name"
    name="name"
    autocomplete="name"
    [value]="fullName()"
    [error]="fieldErrors().fullName"
    [readonly]="submitting()"
    (valueChange)="edit('fullName', $event)"
  />
  <cf-text-field
    slot="fields"
    fieldId="f-email"
    label="Email"
    name="email"
    type="email"
    autocomplete="email"
    [value]="email()"
    [error]="
      fieldErrors().email ??
      (refusal() === 'email-taken' ? 'An account with this email already exists.' : null)
    "
    [errorLink]="refusal() === 'email-taken' ? 'Sign in instead?' : undefined"
    errorHref="/sign-in"
    [readonly]="submitting()"
    (valueChange)="edit('email', $event)"
  />
  <cf-text-field
    slot="fields"
    fieldId="f-password"
    label="Password"
    name="password"
    type="password"
    autocomplete="new-password"
    hint="At least 8 characters"
    [value]="password()"
    [error]="fieldErrors().password"
    [readonly]="submitting()"
    (valueChange)="edit('password', $event)"
  />
  <cf-text-field
    slot="fields"
    fieldId="f-church"
    label="Home church"
    name="church"
    hint="Optional — helps you find people nearby"
    [value]="homeChurch()"
    [error]="fieldErrors().homeChurch"
    [readonly]="submitting()"
    (valueChange)="edit('homeChurch', $event)"
  />
  <cf-interest-picker
    slot="fields"
    legend="What are you into?"
    [options]="options"
    [selected]="interests()"
    [disabled]="submitting()"
    (toggled)="toggle($event)"
  />
  <cf-button
    slot="submit"
    type="submit"
    size="lg"
    block
    [disabled]="submitting()"
    [busy]="submitting()"
  >
    @if (submitting()) {
      <svg class="icon icon--spin" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg
      >Creating your profile…
    } @else {
      Create profile
    }
  </cf-button>
</cf-auth-layout>
