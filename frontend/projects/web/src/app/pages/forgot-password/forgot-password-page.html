@if (sentTo(); as sent) {
  <cf-auth-layout
    notice
    heading="Check your email"
    altText="Didn't get it? Check your spam folder or"
    altLink="send it again"
    altEnd="."
    (altChosen)="sendAgain()"
  >
    <span slot="lead"
      >If an account exists for <strong>{{ sent }}</strong>, a reset link is on its way. It expires
      in 30 minutes.</span
    >
    <cf-button slot="submit" href="/sign-in" variant="secondary" size="lg" block>
      Back to sign in
    </cf-button>
  </cf-auth-layout>
} @else {
  <cf-auth-layout
    heading="Reset your password"
    lead="Enter the email you joined with and we'll send a link to choose a new one."
    altLink="Back to sign in"
    altHref="/sign-in"
    (submitted)="submit()"
  >
    @if (summary().length) {
      <cf-form-alert slot="alert" heading="Check your email address" [items]="summary()" />
    } @else if (limited()) {
      <cf-form-alert
        slot="alert"
        heading="Too many requests"
        text="Too many reset links were asked for from this network in the last hour. Try again later."
      />
    } @else if (failed()) {
      <cf-form-alert
        slot="alert"
        heading="We couldn't send the email"
        text="Something went wrong on our side. Try again in a minute."
      />
    }
    <cf-text-field
      slot="fields"
      fieldId="f-email"
      label="Email"
      name="email"
      type="email"
      autocomplete="email"
      [value]="email()"
      [error]="emailError()"
      [readonly]="submitting()"
      (valueChange)="edit($event)"
    />
    <cf-button
      slot="submit"
      type="submit"
      size="lg"
      block
      [disabled]="submitting()"
      [busy]="submitting()"
    >
      @if (submitting()) {
        <svg class="icon icon--spin" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg
        >Sending…
      } @else {
        Send reset link
      }
    </cf-button>
  </cf-auth-layout>
}
