@switch (phase()) {
  @case ('checking') {
    <cf-auth-layout notice busy heading="Claim a listing">
      <span slot="lead"
        ><svg class="icon icon--spin" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg
        >Checking your link…</span
      >
    </cf-auth-layout>
  }
  @case ('ready') {
    <cf-auth-layout
      notice
      [heading]="heading()"
      lead="Sign in or join first, so the listing is yours and you can edit it later. We bring you straight back here."
      [altText]="note()"
    >
      <cf-button slot="submit" [href]="signInHref" size="lg" block>Sign in</cf-button>
      <cf-button slot="submit" [href]="joinHref" variant="secondary" size="lg" block
        >Join Christian Fitness</cf-button
      >
    </cf-auth-layout>
  }
  @case ('expired') {
    <cf-auth-layout
      notice
      heading="This link has expired"
      lead="This link has expired. Ask us for a new one."
    >
      <cf-button slot="submit" [href]="signInHref" size="lg" block>Sign in</cf-button>
    </cf-auth-layout>
  }
  @case ('claimed') {
    <cf-auth-layout
      notice
      heading="This listing has already been claimed"
      lead="A link works once. If that was you, sign in, find your listing in the directory and use Edit listing."
    >
      <cf-button slot="submit" [href]="signInHref" size="lg" block>Sign in</cf-button>
    </cf-auth-layout>
  }
  @default {
    <main id="main" class="claim-sign-in-page">
      <cf-container page="default">
        <cf-error-page
          code="404"
          heading="Page not found"
          text="That link may be old, or the page has moved. Everything else is right where you left it."
        >
          <cf-button slot="actions" href="/" size="sm">Go to home</cf-button>
        </cf-error-page>
      </cf-container>
    </main>
  }
}
