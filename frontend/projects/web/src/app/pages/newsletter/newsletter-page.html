<cf-skip-link />
<div class="issue-page">
  @if (state() !== 'not-found') {
    <div class="issue-page__bar">
      <a class="back-link" href="/" (click)="$event.preventDefault(); go('/')">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
        Christian Fitness
      </a>
      <span>{{ bar() }}</span>
    </div>
  }
  <main id="main">
    @switch (state()) {
      @case ('not-found') {
        <cf-container page="default">
          <cf-error-page
            code="404"
            heading="Page not found"
            text="That link may be old, or the page has moved. Everything else is right where you left it."
          >
            <cf-button slot="actions" href="/" size="sm">Go to home</cf-button>
            <cf-button slot="actions" href="/subscribe" variant="secondary" size="sm"
              >Subscribe</cf-button
            >
          </cf-error-page>
        </cf-container>
      }
      @case ('loading') {
        <cf-skeleton-region label="Loading the newsletter" heading>
          <div class="issue-page__sheet issue-page__sheet--loading">
            <cf-skeleton shape="title-lg" />
            <cf-skeleton width="40" />
            <cf-skeleton shape="tile" />
            <cf-skeleton shape="title" />
            <cf-skeleton width="90" />
            <cf-skeleton width="80" />
          </div>
        </cf-skeleton-region>
      }
      @case ('failed') {
        <div class="issue-page__sheet">
          <h1 class="visually-hidden">Newsletter</h1>
          <cf-empty-state
            variant="error"
            heading="This issue didn't load"
            text="We couldn't reach Christian Fitness. Check your connection and try again."
          >
            <cf-button slot="actions" size="sm" (click)="retry()">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
                <path d="M21 3v5h-5" /></svg
              >Try again
            </cf-button>
            <cf-button slot="actions" size="sm" variant="secondary" href="/"
              >Back to news</cf-button
            >
          </cf-empty-state>
        </div>
      }
      @default {
        @if (words(); as words) {
          <cf-issue-view [issue]="words" eventsHref="/" (navigate)="go($event)" />
        }
      }
    }
  </main>
</div>
