<main id="main" class="server-error-page">
  <div class="container page">
    <cf-error-page code="500" heading="Something went wrong" [text]="text">
      <cf-button slot="actions" [href]="retry" size="sm"
        ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" /></svg
        >Try again</cf-button
      >
      <cf-button slot="actions" href="/" variant="secondary" size="sm">Go to home</cf-button>
    </cf-error-page>
  </div>
</main>
