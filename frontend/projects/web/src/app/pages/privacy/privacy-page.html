<cf-skip-link />
<cf-top-bar variant="site" homeHref="/" documentHref="/terms" documentLabel="Terms of Service" />
<cf-legal-change />
<main id="main">
  <cf-container page="default"
    ><cf-prose
      title="Privacy Policy"
      [effective]="effective"
      [points]="points"
      [sections]="sections"
      ><cf-legal-change slot="change" summaryFor="privacy" /><cf-side-navigation
        slot="contents"
        route="/privacy"
        [entries]="sections"
        (navigate)="router.navigateByUrl($event)" /></cf-prose
  ></cf-container>
</main>
